<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BSC - Revisión de registro por Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
 --navy:#023859; --blood:#6399BA; --gray:#808080; --gloss:#D1D1D1;
 --green:#74AD52; --red:#D72D41; --bg:#FFFFFF; --soft:#F4F7F9; --ink:#22303D; --line:#E7EBEF;
 --font:"Elms Sans","Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
html{background:#FFFFFF}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
 font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:40px 24px 64px}
header{border-bottom:2px solid var(--navy);padding-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--gray);margin:0 0 10px}
h1{font-size:28px;line-height:1.18;font-weight:600;color:var(--navy);margin:0 0 9px;letter-spacing:-.015em}
.sub{color:var(--gray);font-size:13.5px;margin:0}
h2{font-size:18.5px;font-weight:600;color:var(--navy);margin:52px 0 5px;letter-spacing:-.005em}
h2::before{content:"";display:block;width:36px;height:3px;background:var(--blood);margin-bottom:12px}
.lead{color:var(--gray);font-size:13.5px;margin:0 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:32px 0 6px}
.kpi{border:1px solid var(--line);border-radius:3px;padding:18px 18px 16px}
.kpi .v{font-size:32px;font-weight:600;color:var(--navy);line-height:1.05;letter-spacing:-.02em}
.kpi .d{font-size:12px;font-weight:600;color:var(--green);margin-top:6px}
.kpi .l{font-size:11.5px;color:var(--gray);margin-top:8px;line-height:1.4}
.card{border:1px solid var(--line);border-radius:3px;padding:20px;margin:20px 0}
.card svg{display:block;width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px}
tbody td{border-bottom:1px solid var(--gloss)}
thead th{background:var(--navy);color:#fff;font-weight:600;font-size:12px}
td.n,th.n{text-align:center}
.pct{font-weight:600;color:var(--navy)}
tr.tot td{font-weight:600;background:var(--soft);border-top:2px solid var(--navy);border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mx{font-size:12.5px;min-width:680px}
table.mx th{text-align:center;padding:7px 5px}
table.mx th.hl{text-align:left}
table.mx th.mm{font-weight:400;font-size:10.5px;color:#C6DCEA}
table.mx td.hl{white-space:nowrap}
table.mx td.c{text-align:center;font-weight:600;width:36px}
table.mx td.ok{color:var(--green)} table.mx td.bad{color:var(--red)}
table.mx td.tt{text-align:center;font-weight:600;color:var(--navy)}
table.mx td.sep{border-left:1px solid var(--gloss)}
table.mx thead th.sep{border-left:1px solid rgba(255,255,255,.35)}
table.mx td.t0{color:var(--gloss)}
table.mx tbody tr:nth-child(even){background:var(--soft)}
ul.cols{columns:2;column-gap:32px;margin:12px 0 0;padding-left:18px;font-size:13.5px}
ul.cols li{margin-bottom:6px;break-inside:avoid}
ul.find{padding-left:0;list-style:none;margin:16px 0 0}
ul.find li{border-left:2px solid var(--blood);padding:2px 0 2px 16px;margin-bottom:20px}
ul.find li.low{border-left-color:var(--gloss)}
ul.find b{color:var(--navy);font-weight:600}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--gray);border:1px solid var(--gloss);border-radius:2px;padding:1px 7px;margin-left:7px;vertical-align:2px}
footer{margin-top:60px;padding-top:18px;border-top:2px solid var(--navy);
 font-size:11.5px;color:var(--gray);line-height:1.8}
.err{border-left:3px solid var(--red);padding:14px 18px;background:var(--soft);margin:40px 0;font-size:14px}
.err b{color:var(--navy)}
.load{color:var(--gray);font-size:14px;padding:40px 0}
@media(max-width:620px){ul.cols{columns:1}h1{font-size:22px}.wrap{padding:28px 16px 48px}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="load">Cargando datos…</p></div>

<script>
const NAVY="#023859", BLOOD="#6399BA", GRAY="#808080", GLOSS="#D1D1D1";
const R = x => Math.floor(x + 0.5);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function calcular(d){
  const M = d.meses.length;
  const apl = d.hoteles.filter(h => h.cc[0] !== 'N');
  const N = apl.length;
  const cnt = (campo, i) => apl.filter(h => h[campo][i] === 'C').length;
  const CC = d.meses.map((_, i) => cnt('cc', i));
  const PA = d.meses.map((_, i) => cnt('pa', i));
  const CCT = CC.reduce((a,b) => a+b, 0);
  const PAT = PA.reduce((a,b) => a+b, 0);
  const TOT = CCT + PAT;
  const ACI = R((N*2*M - TOT) / (N*2*M) * 100);
  const GA = d.meses.map((_, i) => R((2*N - CC[i] - PA[i]) / (2*N) * 100));
  const rank = apl.map(h => {
    const c = [...h.cc].filter(x => x === 'C').length;
    const p = [...h.pa].filter(x => x === 'C').length;
    return {t: c+p, c, p, n: h.n};
  }).sort((a,b) => b.t - a.t || a.n.localeCompare(b.n));
  return {M, apl, N, CC, PA, CCT, PAT, TOT, ACI, GA, rank,
          perf: rank.filter(r => r.t === 0).map(r => r.n),
          top:  rank.filter(r => r.t >= M)};
}

function chart1(d, s){
  const W=720, H=320, L=54, Rr=16, T=44, B=56, pw=W-L-Rr, ph=H-T-B;
  const gw = pw/s.M, bw = Math.min(58, gw*0.27), gap = gw*0.075;
  let o = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acierto por mes y vertiente">';
  o += '<text x="0" y="14" font-size="12.5" font-weight="600" fill="' + NAVY + '">Participación frente a Costo por Canal, mes a mes</text>';
  o += '<text x="0" y="31" font-size="11" fill="' + GRAY + '">% de registros validados sin intervención de la Agencia</text>';
  for (let g=0; g<=100; g+=25){
    const y = T+ph-ph*g/100;
    o += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W-Rr) + '" y2="' + y.toFixed(1) + '" stroke="' + GLOSS + '" stroke-width="1"/>';
    o += '<text x="' + (L-10) + '" y="' + (y+4).toFixed(1) + '" text-anchor="end" font-size="11" fill="' + GRAY + '">' + g + '%</text>';
  }
  d.meses.forEach((m, i) => {
    const cx = L + gw*i + gw/2;
    const pares = [[R((s.N-s.CC[i])/s.N*100), GLOSS, GRAY], [R((s.N-s.PA[i])/s.N*100), NAVY, NAVY]];
    pares.forEach((par, j) => {
      const v = par[0], col = par[1], tc = par[2];
      const x = cx-(bw+gap/2)+j*(bw+gap), h = ph*v/100, y = T+ph-h;
      o += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + col + '"/>';
      o += '<text x="' + (x+bw/2).toFixed(1) + '" y="' + (y-7).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="600" fill="' + tc + '">' + v + '%</text>';
    });
    o += '<text x="' + cx.toFixed(1) + '" y="' + (T+ph+22) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="' + NAVY + '">' + esc(m) + '</text>';
  });
  o += '<line x1="' + L + '" y1="' + (T+ph) + '" x2="' + (W-Rr) + '" y2="' + (T+ph) + '" stroke="' + NAVY + '" stroke-width="1.5"/>';
  const ly = H-12;
  o += '<rect x="' + L + '" y="' + (ly-9) + '" width="11" height="11" fill="' + GLOSS + '"/><text x="' + (L+17) + '" y="' + ly + '" font-size="12" fill="' + GRAY + '">Costo por Canal</text>';
  o += '<rect x="' + (L+160) + '" y="' + (ly-9) + '" width="11" height="11" fill="' + NAVY + '"/><text x="' + (L+177) + '" y="' + ly + '" font-size="12" fill="' + GRAY + '">Participación Web Seg. Individual</text>';
  return o + '</svg>';
}

function chart2(s){
  const rows = s.top, W=720, rh=30, T=54, H=T+rows.length*rh+36, L=232, pw=W-L-70, mx=s.M*2;
  let o = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hoteles con más correcciones">';
  o += '<text x="0" y="14" font-size="12.5" font-weight="600" fill="' + NAVY + '">Hoteles que concentran las correcciones del periodo</text>';
  o += '<text x="0" y="31" font-size="11" fill="' + GRAY + '">Correcciones sobre ' + mx + ' registros posibles (' + s.M + ' meses × 2 vertientes)</text>';
  rows.forEach((r, i) => {
    const y = T + i*rh, wc = pw*r.c/mx, wp = pw*r.p/mx;
    o += '<text x="' + (L-12) + '" y="' + (y+15) + '" text-anchor="end" font-size="12.5" fill="' + NAVY + '">' + esc(r.n) + '</text>';
    o += '<rect x="' + L + '" y="' + (y+3) + '" width="' + pw + '" height="17" fill="#F2F5F7"/>';
    if (r.c) o += '<rect x="' + L + '" y="' + (y+3) + '" width="' + wc.toFixed(1) + '" height="17" fill="' + GLOSS + '"/>';
    if (r.p) o += '<rect x="' + (L+wc).toFixed(1) + '" y="' + (y+3) + '" width="' + wp.toFixed(1) + '" height="17" fill="' + NAVY + '"/>';
    o += '<text x="' + (L+wc+wp+9).toFixed(1) + '" y="' + (y+16) + '" font-size="13" font-weight="600" fill="' + NAVY + '">' + r.t + '</text>';
  });
  const ly = H-10;
  o += '<rect x="' + L + '" y="' + (ly-9) + '" width="11" height="11" fill="' + GLOSS + '"/><text x="' + (L+17) + '" y="' + ly + '" font-size="12" fill="' + GRAY + '">Costo por Canal</text>';
  o += '<rect x="' + (L+160) + '" y="' + (ly-9) + '" width="11" height="11" fill="' + NAVY + '"/><text x="' + (L+177) + '" y="' + ly + '" font-size="12" fill="' + GRAY + '">Participación</text>';
  return o + '</svg>';
}

function tablaMes(d, s){
  let f = '';
  d.meses.forEach((m, i) => {
    f += '<tr><td class="hl">' + esc(m) + '</td>'
      + '<td class="n">' + (s.N-s.CC[i]) + '</td><td class="n">' + s.CC[i] + '</td><td class="n pct">' + R((s.N-s.CC[i])/s.N*100) + '%</td>'
      + '<td class="n">' + (s.N-s.PA[i]) + '</td><td class="n">' + s.PA[i] + '</td><td class="n pct">' + R((s.N-s.PA[i])/s.N*100) + '%</td>'
      + '<td class="n pct">' + s.GA[i] + '%</td></tr>';
  });
  const tot = s.N*s.M;
  f += '<tr class="tot"><td class="hl">Total periodo</td>'
    + '<td class="n">' + (tot-s.CCT) + '</td><td class="n">' + s.CCT + '</td><td class="n pct">' + R((tot-s.CCT)/tot*100) + '%</td>'
    + '<td class="n">' + (tot-s.PAT) + '</td><td class="n">' + s.PAT + '</td><td class="n pct">' + R((tot-s.PAT)/tot*100) + '%</td>'
    + '<td class="n pct">' + s.ACI + '%</td></tr>';
  return '<div class="scroll"><table><thead>'
    + '<tr><th rowspan="2" style="vertical-align:bottom">Mes</th><th colspan="3" class="n">Costo por Canal</th><th colspan="3" class="n">Participación Web Seg. Individual</th><th rowspan="2" class="n" style="vertical-align:bottom">Acierto<br>global</th></tr>'
    + '<tr><th class="n">Validado</th><th class="n">Corregido</th><th class="n">%</th><th class="n">Validado</th><th class="n">Corregido</th><th class="n">%</th></tr>'
    + '</thead><tbody>' + f + '</tbody></table></div>';
}

function matriz(d, s){
  const th = sep => d.meses.map((m,k) => '<th class="mm' + (sep && k===0 ? ' sep' : '') + '">' + esc(m).slice(0,3) + '</th>').join('');
  const tm = {};
  s.rank.forEach(r => { tm[r.n] = r.t; });
  let body = '';
  s.apl.forEach(h => {
    const t = tm[h.n];
    let cells = '';
    ['cc','pa'].forEach((campo, i) => {
      [...h[campo]].forEach((v, k) => {
        const sep = (i === 1 && k === 0) ? ' sep' : '';
        cells += '<td class="c ' + (v === 'V' ? 'ok' : 'bad') + sep + '">' + (v === 'V' ? '✓' : '✕') + '</td>';
      });
    });
    body += '<tr><td class="hl">' + esc(h.n) + '</td>' + cells + '<td class="tt sep ' + (t === 0 ? 't0' : '') + '">' + t + '</td></tr>';
  });
  return '<div class="scroll"><table class="mx"><thead>'
    + '<tr><th rowspan="2" class="hl">Hotel</th><th colspan="' + s.M + '">Costo por Canal</th><th colspan="' + s.M + '" class="sep">Participación Web Seg. Individual</th><th rowspan="2" class="sep">Total</th></tr>'
    + '<tr>' + th(false) + th(true) + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function render(d){
  const s = calcular(d);
  const mx = s.M*2;
  const delta = s.GA[s.M-1] - s.GA[0];
  const ccIni = R((s.N-s.CC[0])/s.N*100), ccFin = R((s.N-s.CC[s.M-1])/s.N*100);
  const paPct = s.PA.map((_,i) => R((s.N-s.PA[i])/s.N*100));
  const paMin = Math.min.apply(null, paPct), paMax = Math.max.apply(null, paPct);
  const mes0 = esc(d.meses[0]).toLowerCase(), mesF = esc(d.meses[s.M-1]).toLowerCase();

  let h = '<header>'
    + '<p class="eyebrow">Agencia Digital · Dirección de Mercadeo</p>'
    + '<h1>' + esc(d.titulo) + '</h1>'
    + '<p class="sub">Costo por Canal y Participación Web Seg. Individual · ' + esc(d.periodo) + ' · ' + s.N + ' hoteles</p>'
    + '</header>'
    + '<div class="kpis">'
    + '<div class="kpi"><div class="v">' + s.TOT + '</div><div class="l">Correcciones aplicadas<br>por la Agencia</div></div>'
    + '<div class="kpi"><div class="v">' + s.ACI + '%</div><div class="l">Registros validados<br>sin intervención</div></div>'
    + '<div class="kpi"><div class="v">' + s.GA[s.M-1] + '%</div>'
      + (delta > 0 ? '<div class="d">▲ +' + delta + ' pts vs. ' + mes0 + '</div>' : '')
      + '<div class="l">Acierto del último mes<br>cerrado (' + mesF + ')</div></div>'
    + '<div class="kpi"><div class="v">' + s.perf.length + '</div><div class="l">Hoteles sin ninguna<br>corrección en el periodo</div></div>'
    + '</div>'
    + '<h2>El problema está en Participación, no en Costo por Canal</h2>'
    + '<p class="lead">Costo por Canal pasó de ' + ccIni + ' % a ' + ccFin + ' % de acierto entre ' + mes0 + ' y ' + mesF
      + '. Participación Web Seg. Individual lleva ' + s.M + ' meses entre ' + paMin + ' % y ' + paMax + ' %, y concentra '
      + s.PAT + ' de las ' + s.TOT + ' correcciones del periodo.</p>'
    + '<div class="card">' + chart1(d, s) + '</div>'
    + tablaMes(d, s)
    + '<h2>Las correcciones se concentran en pocos hoteles</h2>'
    + '<p class="lead">' + s.top.length + ' hoteles acumulan ' + s.M + ' o más correcciones de ' + mx
      + ' registros posibles. Trabajar sobre este grupo resuelve buena parte del total.</p>'
    + '<div class="card">' + chart2(s) + '</div>'
    + '<h2>Detalle hotel por hotel</h2>'
    + '<p class="lead">✓ Validado · ✕ Corregido. Un hotel puede registrar bien una vertiente y mal la otra.</p>'
    + matriz(d, s)
    + '<h2>Hoteles impecables en el periodo</h2>'
    + '<p class="lead">' + mx + ' de ' + mx + ' registros validados durante los ' + s.M + ' meses. Son el estándar a replicar.</p>'
    + '<ul class="cols">' + s.perf.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';

  if (d.hallazgos && d.hallazgos.length){
    h += '<h2>Qué tipo de error se está cometiendo</h2>';
    if (d.errores && d.errores.graves != null){
      h += '<p class="lead">No todas las correcciones pesan igual. De las ' + s.TOT + ' del periodo, ' + d.errores.graves
         + ' son errores reales que cambian la lectura del dato; las otras ' + d.errores.leves
         + ' son diferencias de uno o dos puntos por redondeo o fecha de corte.</p>';
    }
    h += '<ul class="find">' + d.hallazgos.map(x =>
      '<li class="' + (x.nivel === 'bajo' ? 'low' : '') + '"><b>' + esc(x.titulo) + '</b> <span class="tag">'
      + esc(x.tag) + '</span><br>' + esc(x.texto) + '</li>').join('') + '</ul>';
  }

  h += '<footer>Elaborado por: Agencia Digital · Dirección de Mercadeo · Oficina Central GHL · ' + esc(d.elaborado)
    + '<br>Fuente: matriz de revisión Agencia Digital, ' + esc(d.periodo).toLowerCase()
    + '. Base de cálculo: ' + s.N + ' hoteles aplicables por mes y vertiente.</footer>';

  document.getElementById('app').innerHTML = h;
  document.title = d.titulo;
}

fetch('datos.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="err"><b>No se pudieron cargar los datos.</b><br>' + esc(e.message)
      + '<br><br>Revise que el archivo <code>datos.json</code> esté en la misma carpeta que esta página y que su contenido sea JSON válido. El error más común es una coma de más al final de una lista.</div>';
  });
</script>
</body>
</html>
